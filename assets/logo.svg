<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" role="img" aria-label="Redbird Recruiting">
  <defs>
    <linearGradient id="rbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="60%" stop-color="#B2221A"/>
      <stop offset="100%" stop-color="#8A1813"/>
    </linearGradient>
  </defs>
  <!-- Stylized bird mark -->
  <g transform="translate(6,10)">
    <path d="M4 30 C 10 14, 24 8, 38 14 C 42 12, 46 12, 48 16 C 46 18, 44 19, 42 19 C 44 24, 40 30, 34 32 C 28 34, 20 34, 14 36 C 10 37, 6 36, 4 34 Z"
